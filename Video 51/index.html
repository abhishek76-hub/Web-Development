<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 100vh;
            width: 100vw;
            border: 2px solid black;
            background-color: beige;
        }

        .ball {
            height: 70px;
            width: 70px;
            border: 2px solid black;
            margin-top: 830px;
            background-color: rgb(166, 119, 209);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animationx 7s linear infinite, animationy 1s ease-out infinite alternate;
        }

        @keyframes animationx {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }

        @keyframes animationy {
            from {
                bottom: 0;
            }

            to {
                bottom: 70%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>

</html>
