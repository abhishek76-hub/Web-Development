<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container {
            border: 2px solid red;
            height: 80vh;
            display: flex;
            /* justify-content: center; */
            /* align-items: center; */
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            /* flex-wrap: wrap; */
            /* align-content: center; */
            align-content: flex-start;

            /* Note:-There is no justify-item in flexbox */

            /* flex-flow: row wrap; */
            /* gap: 20px; */
            /* row-gap: 20px;
            column-gap: 10px;
             */
            gap: 20px 10px;
        }

        .item {
            /* flex-grow: 1; */
            border: 2px solid black;
            height: 92px;
            width: 92px;
            /* margin: 5px; */
            background-color: aqua;
        }
        /* Note:- Default order = 0 */
        .order-1 {
            order: 1;
        }

        .order-2 {
            order: 2;
        }

        .order-3 {
            order: 3;
        }
        .item1{
            /* flex-grow: 2; */
            /* flex-shrink: 2; */
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="item item1">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item order-1">4</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>

        </div>
    </main>
</body>

</html>
