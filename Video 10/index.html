<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
</head>
<body>
    <video src="Video.mp4" height="300" controls autoplay loop muted poster="Image.png"></video>
    <audio src="TuHaiTo.mp3" controls autoplay muted loop preload="auto"></audio> <!-- preload = "metadata / none/ auto"-->
    
    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>

    <img src="img.svg" alt="My Svg Image">
