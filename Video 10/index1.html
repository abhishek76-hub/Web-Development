    <!-- Create a website which shows videos of different category and audios of different categories.
    You can use YouTube videos in an iframe using YouTube's embedding feature -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Multimedia Website</title>
    </head>
    <body>
        <h1>My Multimedia</h1>\

        <video src="Bmw.mp4" height="255" controls autoplay>Bmw</video>
        <video src="Lamborgini.mp4" height="255"controls loop>Lamborgani</video>
        <video src="Video.mp4" height="255"controls muted poster="Image.png">Random video</video>

        <audio src="TuHaiTo.mp3" controls autoplay preload="metadata">Tu Hai To</audio>
        <audio src="Bairan.mp3" controls loop preload="auto">Bairan</audio>
        <audio src="jhol.mp3" controls muted preload="none">Jhol</audio>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/sdMHVIcPGwg?si=6F_ER9h43w6iAy9s&amp;start=3969" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
    </html>
